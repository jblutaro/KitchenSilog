<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" shape-rendering="crispEdges" width="48" height="32">
  <!-- plate shadow -->
  <rect x="4" y="28" width="40" height="3" fill="#2B1A0E" opacity="0.3"/>
  <!-- plate rim outer -->
  <rect x="2" y="10" width="44" height="18" fill="#E8E0D0"/>
  <rect x="6" y="6"  width="36" height="4"  fill="#E8E0D0"/>
  <rect x="10" y="4" width="28" height="2"  fill="#E8E0D0"/>
  <rect x="4" y="8"  width="4"  height="2"  fill="#E8E0D0"/>
  <rect x="40" y="8" width="4"  height="2"  fill="#E8E0D0"/>
  <!-- plate rim inner (cream ridge) -->
  <rect x="4" y="12" width="40" height="14" fill="#F5EEE0"/>
  <rect x="8" y="8"  width="32" height="4"  fill="#F5EEE0"/>
  <rect x="12" y="6" width="24" height="2"  fill="#F5EEE0"/>
  <!-- plate inner well (where food sits) -->
  <rect x="8" y="14" width="32" height="10" fill="#FFFDF5"/>
  <rect x="12" y="12" width="24" height="2" fill="#FFFDF5"/>
  <rect x="12" y="24" width="24" height="2" fill="#FFFDF5"/>
  <!-- rim highlight top-left -->
  <rect x="10" y="6"  width="8" height="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="4"  y="10" width="4" height="1" fill="#FFFFFF" opacity="0.6"/>
  <!-- rim shadow bottom-right -->
  <rect x="36" y="24" width="8" height="1" fill="#C8C0B0"/>
  <rect x="44" y="18" width="2" height="6" fill="#C8C0B0"/>
  <!-- outer border/outline -->
  <rect x="2"  y="10" width="44" height="1" fill="#2B1A0E" opacity="0.5"/>
  <rect x="2"  y="27" width="44" height="1" fill="#2B1A0E" opacity="0.5"/>
  <rect x="2"  y="10" width="1"  height="18" fill="#2B1A0E" opacity="0.5"/>
  <rect x="45" y="10" width="1"  height="18" fill="#2B1A0E" opacity="0.5"/>
  <rect x="6"  y="6"  width="36" height="1" fill="#2B1A0E" opacity="0.4"/>
  <rect x="10" y="4"  width="28" height="1" fill="#2B1A0E" opacity="0.3"/>
</svg>
