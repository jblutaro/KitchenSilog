<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" shape-rendering="crispEdges" width="80" height="100">
  <!-- Hood/top panel -->
  <rect x="0" y="0" width="80" height="12" fill="#C8A06A"/>
  <rect x="4" y="2" width="72" height="8" fill="#D4B07A"/>
  <!-- Hood knobs -->
  <rect x="10" y="3" width="6" height="6" fill="#7B4A1E"/>
  <rect x="24" y="3" width="6" height="6" fill="#7B4A1E"/>
  <rect x="50" y="3" width="6" height="6" fill="#7B4A1E"/>
  <rect x="64" y="3" width="6" height="6" fill="#7B4A1E"/>
  <!-- Stove face / burner panel -->
  <rect x="0" y="12" width="80" height="54" fill="#7B4A1E"/>
  <rect x="4" y="14" width="72" height="50" fill="#C8903A"/>
  <!-- Burner panel inner -->
  <rect x="6" y="16" width="68" height="46" fill="#5A3010"/>
  <!-- Left-top burner -->
  <rect x="10" y="20" width="24" height="18" fill="#3A2008"/>
  <rect x="13" y="22" width="18" height="14" fill="#1A0A00"/>
  <rect x="14" y="23" width="6" height="5" fill="#C8903A"/>
  <rect x="22" y="23" width="6" height="5" fill="#C8903A"/>
  <rect x="14" y="30" width="6" height="5" fill="#C8903A"/>
  <rect x="22" y="30" width="6" height="5" fill="#C8903A"/>
  <!-- Right-top burner -->
  <rect x="46" y="20" width="24" height="18" fill="#3A2008"/>
  <rect x="49" y="22" width="18" height="14" fill="#1A0A00"/>
  <rect x="50" y="23" width="6" height="5" fill="#C8903A"/>
  <rect x="58" y="23" width="6" height="5" fill="#C8903A"/>
  <rect x="50" y="30" width="6" height="5" fill="#C8903A"/>
  <rect x="58" y="30" width="6" height="5" fill="#C8903A"/>
  <!-- Left-bottom burner -->
  <rect x="10" y="42" width="24" height="18" fill="#3A2008"/>
  <rect x="13" y="44" width="18" height="14" fill="#1A0A00"/>
  <rect x="14" y="45" width="6" height="5" fill="#C8903A"/>
  <rect x="22" y="45" width="6" height="5" fill="#C8903A"/>
  <rect x="14" y="52" width="6" height="5" fill="#C8903A"/>
  <rect x="22" y="52" width="6" height="5" fill="#C8903A"/>
  <!-- Right-bottom burner -->
  <rect x="46" y="42" width="24" height="18" fill="#3A2008"/>
  <rect x="49" y="44" width="18" height="14" fill="#1A0A00"/>
  <rect x="50" y="45" width="6" height="5" fill="#C8903A"/>
  <rect x="58" y="45" width="6" height="5" fill="#C8903A"/>
  <rect x="50" y="52" width="6" height="5" fill="#C8903A"/>
  <rect x="58" y="52" width="6" height="5" fill="#C8903A"/>
  <!-- Center divider dot -->
  <rect x="38" y="37" width="4" height="4" fill="#1A0A00"/>
  <!-- Divider bar between top/bottom -->
  <rect x="6" y="39" width="68" height="2" fill="#3A2008"/>
  <!-- Oven section -->
  <rect x="0" y="66" width="80" height="4" fill="#2B1A0E"/>
  <rect x="0" y="70" width="80" height="30" fill="#C8903A"/>
  <rect x="4" y="72" width="72" height="24" fill="#7B4A1E"/>
  <rect x="8" y="74" width="64" height="20" fill="#5A3010"/>
  <!-- Oven door handle -->
  <rect x="12" y="78" width="56" height="4" fill="#D4B07A"/>
  <rect x="14" y="79" width="52" height="2" fill="#7B4A1E"/>
  <!-- Oven window -->
  <rect x="14" y="84" width="52" height="8" fill="#1A0A00"/>
  <rect x="16" y="85" width="48" height="6" fill="#0A0500" opacity="0.8"/>
  <!-- Outer border -->
  <rect x="0" y="0" width="2" height="100" fill="#2B1A0E"/>
  <rect x="78" y="0" width="2" height="100" fill="#2B1A0E"/>
  <rect x="0" y="0" width="80" height="2" fill="#2B1A0E"/>
  <rect x="0" y="98" width="80" height="2" fill="#2B1A0E"/>
</svg>
